<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Судоку</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #8a8a8a);
    --link: var(--tg-theme-link-color, #2481cc);
    --btn: var(--tg-theme-button-color, #2481cc);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --secondary-bg: var(--tg-theme-secondary-bg-color, #f0f0f0);
    --cell-size: min(10vw, 44px);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    padding: 12px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    user-select: none;
  }

  h1 {
    font-size: 22px;
    margin: 4px 0 12px;
    font-weight: 600;
  }

  .top-bar {
    width: 100%;
    max-width: 420px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    font-size: 14px;
  }

  .top-bar select {
    background: var(--secondary-bg);
    color: var(--text);
    border: none;
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 14px;
  }

  .timer {
    font-variant-numeric: tabular-nums;
    color: var(--hint);
  }

  .mistakes {
    color: #d9534f;
    font-weight: 500;
  }

  .board {
    display: grid;
    grid-template-columns: repeat(9, var(--cell-size));
    grid-template-rows: repeat(9, var(--cell-size));
    border: 2px solid var(--text);
    background: var(--text);
    gap: 1px;
    margin: 8px 0;
  }

  .cell {
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: calc(var(--cell-size) * 0.55);
    font-weight: 500;
    cursor: pointer;
    position: relative;
    transition: background 0.15s;
  }

  .cell.given { font-weight: 700; color: var(--text); }
  .cell.user  { color: var(--link); }
  .cell.error { color: #d9534f !important; }

  .cell[data-col="2"], .cell[data-col="5"] { border-right: 2px solid var(--text); }
  .cell[data-row="2"], .cell[data-row="5"] { border-bottom: 2px solid var(--text); }

  .cell.selected { background: color-mix(in srgb, var(--link) 35%, var(--bg)); }
  .cell.highlight { background: color-mix(in srgb, var(--link) 12%, var(--bg)); }
  .cell.same-num  { background: color-mix(in srgb, var(--link) 22%, var(--bg)); }

  .cell .notes {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    font-size: calc(var(--cell-size) * 0.22);
    font-weight: 400;
    color: var(--hint);
    padding: 1px;
  }
  .cell .notes span {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .numpad {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    gap: 4px;
    width: 100%;
    max-width: 420px;
    margin-top: 8px;
  }

  .numpad button {
    aspect-ratio: 1;
    border: none;
    border-radius: 8px;
    background: var(--secondary-bg);
    color: var(--text);
    font-size: 18px;
    font-weight: 500;
    cursor: pointer;
  }
  .numpad button.active { background: var(--btn); color: var(--btn-text); }

  .actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .actions button {
    background: var(--secondary-bg);
    color: var(--text);
    border: none;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .actions button.primary { background: var(--btn); color: var(--btn-text); }

  .modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  .modal.show { display: flex; }
  .modal-box {
    background: var(--bg);
    color: var(--text);
    padding: 24px;
    border-radius: 16px;
    text-align: center;
    max-width: 320px;
  }
  .modal-box h2 { margin: 0 0 8px; }
  .modal-box button {
    margin-top: 14px;
    background: var(--btn);
    color: var(--btn-text);
    border: none;
    padding: 10px 20px;
    border-radius: 10px;
    font-size: 15px;
    cursor: pointer;
  }
</style>
</head>
<body>

<h1>🧩 Судоку</h1>

<div class="top-bar">
  <select id="difficulty">
    <option value="easy">Легко</option>
    <option value="medium" selected>Средне</option>
    <option value="hard">Сложно</option>
  </select>
  <div class="timer" id="timer">00:00</div>
  <div class="mistakes" id="mistakes">Ошибки: 0</div>
</div>

<div class="board" id="board"></div>

<div class="numpad" id="numpad"></div>

<div class="actions">
  <button id="undoBtn"> Отмена</button>
  <button id="eraseBtn">⌫ Стереть</button>
  <button id="notesBtn">✏️ Заметки</button>
  <button id="hintBtn">💡 Подсказка</button>
  <button id="newBtn" class="primary">🔄 Новая</button>
</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <h2 id="modalTitle">🎉 Победа!</h2>
    <p id="modalText">Вы решили судоку!</p>
    <button onclick="document.getElementById('modal').classList.remove('show')">OK</button>
  </div>
</div>

<script>
/* ---------- Telegram WebApp ---------- */
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  tg.enableClosingConfirmation();
}
function haptic(type = 'light') {
  try { tg?.HapticFeedback?.selectionChanged?.(); } catch(e){}
}

/* ---------- Состояние ---------- */
const state = {
  solution: null,
  puzzle: null,
  board: null,
  notes: null,
  selected: null,
  notesMode: false,
  mistakes: 0,
  history: [],
  startTime: 0,
  timerId: null,
  finished: false,
};

const DIFF_CLUES = { easy: 42, medium: 32, hard: 26 };

/* ---------- Генератор судоку ---------- */
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function isValid(grid, r, c, n) {
  for (let i = 0; i < 9; i++) {
    if (grid[r][i] === n || grid[i][c] === n) return false;
  }
  const br = Math.floor(r/3)*3, bc = Math.floor(c/3)*3;
  for (let i = 0; i < 3; i++)
    for (let j = 0; j < 3; j++)
      if (grid[br+i][bc+j] === n) return false;
  return true;
}

// ИСПРАВЛЕНО: теперь сохраняет найденное решение
function solve(grid, result = null, count = {v:0}, limit = 1) {
  for (let r = 0; r < 9; r++) {
    for (let c = 0; c < 9; c++) {
      if (grid[r][c] === 0) {
        for (let n = 1; n <= 9; n++) {
          if (isValid(grid, r, c, n)) {
            grid[r][c] = n;
            solve(grid, result, count, limit);
            if (count.v >= limit) return;
            grid[r][c] = 0;
          }
        }
        return;
      }
    }
  }
  count.v++;
  if (result && count.v === 1) {
    // Сохраняем первое найденное решение
    for (let i = 0; i < 9; i++)
      for (let j = 0; j < 9; j++)
        result[i][j] = grid[i][j];
  }
}

function generateFull() {
  const g = Array.from({length:9}, () => Array(9).fill(0));
  const fillBlock = (br, bc) => {
    const nums = shuffle([1,2,3,4,5,6,7,8,9]);
    let k = 0;
    for (let i = 0; i < 3; i++)
      for (let j = 0; j < 3; j++)
        g[br+i][bc+j] = nums[k++];
  };
  fillBlock(0,0); fillBlock(3,3); fillBlock(6,6);
  const solution = Array.from({length:9}, () => Array(9).fill(0));
  solve(g, solution, {v:0}, 1);
  return solution;
}

function countSolutions(grid, limit = 2) {
  const count = {v:0};
  solve(grid, null, count, limit);
  return count.v;
}

function generatePuzzle(difficulty) {
  const solution = generateFull();
  const puzzle = solution.map(row => row.slice());
  const target = DIFF_CLUES[difficulty] || 32;
  const cells = shuffle([...Array(81).keys()]);
  let removed = 0;
  const toRemove = 81 - target;

  for (const idx of cells) {
    if (removed >= toRemove) break;
    const r = Math.floor(idx/9), c = idx%9;
    const backup = puzzle[r][c];
    puzzle[r][c] = 0;
    // Проверяем единственность решения
    const copy = puzzle.map(row => row.slice());
    if (countSolutions(copy, 2) !== 1) {
      puzzle[r][c] = backup;
    } else {
      removed++;
    }
  }
  return { puzzle, solution };
}

/* ---------- Рендер ---------- */
const boardEl = document.getElementById('board');
const numpadEl = document.getElementById('numpad');

function buildBoard() {
  boardEl.innerHTML = '';
  for (let r = 0; r < 9; r++) {
    for (let c = 0; c < 9; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.row = r;
      cell.dataset.col = c;
      cell.addEventListener('click', () => selectCell(r, c));
      boardEl.appendChild(cell);
    }
  }
}

function buildNumpad() {
  numpadEl.innerHTML = '';
  for (let n = 1; n <= 9; n++) {
    const b = document.createElement('button');
    b.textContent = n;
    b.addEventListener('click', () => inputNumber(n));
    numpadEl.appendChild(b);
  }
}

function render() {
  const cells = boardEl.children;
  const sel = state.selected;
  const selVal = sel ? state.board[sel.r][sel.c] : 0;

  for (let r = 0; r < 9; r++) {
    for (let c = 0; c < 9; c++) {
      const cell = cells[r*9+c];
      const v = state.board[r][c];
      const given = state.puzzle[r][c] !== 0;
      const isSel = sel && sel.r === r && sel.c === c;
      const inSame = selVal && v === selVal;
      const inHighlight = sel && (sel.r === r || sel.c === c ||
        (Math.floor(sel.r/3) === Math.floor(r/3) && Math.floor(sel.c/3) === Math.floor(c/3)));

      cell.className = 'cell';
      if (given) cell.classList.add('given');
      else if (v) cell.classList.add('user');
      if (isSel) cell.classList.add('selected');
      else if (inSame && v) cell.classList.add('same-num');
      else if (inHighlight) cell.classList.add('highlight');

      if (!given && v && v !== state.solution[r][c]) cell.classList.add('error');

      cell.innerHTML = '';
      if (v) {
        cell.textContent = v;
      } else if (state.notes[r][c].size) {
        const wrap = document.createElement('div');
        wrap.className = 'notes';
        for (let n = 1; n <= 9; n++) {
          const s = document.createElement('span');
          s.textContent = state.notes[r][c].has(n) ? n : '';
          wrap.appendChild(s);
        }
        cell.appendChild(wrap);
      }
    }
  }

  const btns = numpadEl.children;
  for (let n = 1; n <= 9; n++) {
    let count = 0;
    for (let r = 0; r < 9; r++)
      for (let c = 0; c < 9; c++)
        if (state.board[r][c] === n) count++;
    btns[n-1].classList.toggle('active', count === 9);
  }

  document.getElementById('mistakes').textContent = `Ошибки: ${state.mistakes}`;
  document.getElementById('notesBtn').style.background =
    state.notesMode ? 'var(--btn)' : '';
  document.getElementById('notesBtn').style.color =
    state.notesMode ? 'var(--btn-text)' : '';
}

/* ---------- Логика ---------- */
function selectCell(r, c) {
  haptic();
  state.selected = { r, c };
  render();
}

function inputNumber(n) {
  if (!state.selected || state.finished) return;
  const { r, c } = state.selected;
  if (state.puzzle[r][c] !== 0) return;
  haptic();

  if (state.notesMode) {
    state.history.push({ r, c, v: state.board[r][c], notes: new Set(state.notes[r][c]) });
    if (state.notes[r][c].has(n)) state.notes[r][c].delete(n);
    else state.notes[r][c].add(n);
    state.board[r][c] = 0;
  } else {
    state.history.push({ r, c, v: state.board[r][c], notes: new Set(state.notes[r][c]) });
    state.board[r][c] = n;
    state.notes[r][c].clear();
    for (let i = 0; i < 9; i++) {
      state.notes[r][i].delete(n);
      state.notes[i][c].delete(n);
    }
    const br = Math.floor(r/3)*3, bc = Math.floor(c/3)*3;
    for (let i = 0; i < 3; i++)
      for (let j = 0; j < 3; j++)
        state.notes[br+i][bc+j].delete(n);

    if (n !== state.solution[r][c]) {
      state.mistakes++;
      try { tg?.HapticFeedback?.notificationOccurred('error'); } catch(e){}
    }
  }

  render();
  checkWin();
}

function erase() {
  if (!state.selected || state.finished) return;
  const { r, c } = state.selected;
  if (state.puzzle[r][c] !== 0) return;
  haptic();
  state.history.push({ r, c, v: state.board[r][c], notes: new Set(state.notes[r][c]) });
  state.board[r][c] = 0;
  state.notes[r][c].clear();
  render();
}

function undo() {
  if (!state.history.length || state.finished) return;
  haptic();
  const last = state.history.pop();
  state.board[last.r][last.c] = last.v;
  state.notes[last.r][last.c] = last.notes;
  render();
}

function hint() {
  if (state.finished) return;
  
  for (let r = 0; r < 9; r++) {
    for (let c = 0; c < 9; c++) {
      if (state.board[r][c] === 0 || state.board[r][c] !== state.solution[r][c]) {
        state.history.push({ r, c, v: state.board[r][c], notes: new Set(state.notes[r][c]) });
        state.board[r][c] = state.solution[r][c];
        state.notes[r][c].clear();
        state.selected = { r, c };
        haptic();
        render();
        checkWin();
        return;
      }
    }
  }
}

function checkWin() {
  let allFilled = true;
  let allCorrect = true;
  
  for (let r = 0; r < 9; r++) {
    for (let c = 0; c < 9; c++) {
      if (state.board[r][c] === 0) {
        allFilled = false;
        allCorrect = false;
        break;
      }
      if (state.board[r][c] !== state.solution[r][c]) {
        allCorrect = false;
      }
    }
    if (!allFilled) break;
  }
  
  if (allFilled && allCorrect) {
    state.finished = true;
    clearInterval(state.timerId);
    const elapsed = Math.floor((Date.now() - state.startTime)/1000);
    const mm = String(Math.floor(elapsed/60)).padStart(2,'0');
    const ss = String(elapsed%60).padStart(2,'0');
    document.getElementById('modalTitle').textContent = '🎉 Победа!';
    document.getElementById('modalText').textContent =
      `Время: ${mm}:${ss} • Ошибки: ${state.mistakes}`;
    document.getElementById('modal').classList.add('show');
    try { tg?.HapticFeedback?.notificationOccurred('success'); } catch(e){}
  }
}

function newGame() {
  const diff = document.getElementById('difficulty').value;
  const { puzzle, solution } = generatePuzzle(diff);
  state.puzzle = puzzle;
  state.solution = solution;
  state.board = puzzle.map(row => row.slice());
  state.notes = Array.from({length:9}, () => Array.from({length:9}, () => new Set()));
  state.selected = null;
  state.notesMode = false;
  state.mistakes = 0;
  state.history = [];
  state.finished = false;
  state.startTime = Date.now();
  clearInterval(state.timerId);
  state.timerId = setInterval(updateTimer, 1000);
  updateTimer();
  render();
}

function updateTimer() {
  const s = Math.floor((Date.now() - state.startTime)/1000);
  const mm = String(Math.floor(s/60)).padStart(2,'0');
  const ss = String(s%60).padStart(2,'0');
  document.getElementById('timer').textContent = `${mm}:${ss}`;
}

/* ---------- События ---------- */
document.getElementById('undoBtn').onclick = undo;
document.getElementById('eraseBtn').onclick = erase;
document.getElementById('hintBtn').onclick = hint;
document.getElementById('newBtn').onclick = newGame;
document.getElementById('notesBtn').onclick = () => {
  state.notesMode = !state.notesMode;
  haptic();
  render();
};
document.getElementById('difficulty').onchange = newGame;

document.addEventListener('keydown', (e) => {
  if (e.key >= '1' && e.key <= '9') inputNumber(parseInt(e.key));
  else if (e.key === 'Backspace' || e.key === 'Delete') erase();
  else if (e.key === 'n' || e.key === 'N') document.getElementById('notesBtn').click();
  else if (e.key === 'z' && (e.ctrlKey || e.metaKey)) undo();
  else if (state.selected) {
    const { r, c } = state.selected;
    if (e.key === 'ArrowUp' && r > 0) selectCell(r-1, c);
    if (e.key === 'ArrowDown' && r < 8) selectCell(r+1, c);
    if (e.key === 'ArrowLeft' && c > 0) selectCell(r, c-1);
    if (e.key === 'ArrowRight' && c < 8) selectCell(r, c+1);
  }
});

/* ---------- Старт ---------- */
buildBoard();
buildNumpad();
newGame();
</script>
</body>
</html>
